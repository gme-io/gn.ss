<meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: arcade cabinet — big Paul stage up top, shop below on phones, side-by-side on wide screens. Single sunny look by choice. */
:root{
  --sky:#8fd3ff; --sky2:#c9ecff; --sun:#ffd23f; --tomato:#ff5a36;
  --ink:#1f2a44; --card:#fffaf0; --line:#1f2a44; --mute:#5a6a8a; --mint:#3ecf8e;
  --display:"Bagel Fat One", "Arial Black", system-ui, sans-serif;
  --body:"Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; font-family:var(--body); color:var(--ink);
  background: radial-gradient(circle at 50% 0%, var(--sky2), var(--sky) 60%);
  background-color: var(--sky);
}
.wrap{
  max-width:1000px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:16px 40px;
  display:grid; gap:16px; grid-template-columns:1fr;
}
@media (min-width:820px){ .wrap{grid-template-columns: 1.1fr 1fr; align-items:start} .stage{position:sticky; top:16px} }

.stage{
  background:var(--sun); border:3px solid var(--line); border-radius:22px;
  box-shadow:6px 6px 0 var(--line); padding:16px; text-align:center; position:relative; overflow:hidden;
}
h1{font-family:var(--display); font-weight:400; font-size:clamp(2rem,7vw,2.8rem); margin:0; line-height:1; letter-spacing:.5px; color:var(--tomato); -webkit-text-stroke:2px var(--line); text-shadow:3px 3px 0 var(--line)}
.count{font-family:var(--display); font-size:clamp(1.8rem,8vw,2.6rem); margin:10px 0 0; font-variant-numeric:tabular-nums; line-height:1}
.count small{display:block; font-family:var(--body); font-size:.95rem; font-weight:600; color:var(--ink); margin-top:4px}
.pps{font-weight:600; color:var(--ink); opacity:.8; font-variant-numeric:tabular-nums}

.paulzone{position:relative; width:min(280px,72vw); aspect-ratio:1; margin:12px auto 6px; max-width:100%}
.rays{position:absolute; inset:-30%; background:repeating-conic-gradient(rgba(255,255,255,.55) 0 10deg, transparent 10deg 20deg); border-radius:50%; animation:spin 30s linear infinite; pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#paul{
  position:relative; width:100%; height:100%; border-radius:50%; border:4px solid var(--line);
  background:var(--card); padding:0; cursor:pointer; overflow:hidden; box-shadow:0 6px 0 var(--line);
  transition:transform .08s; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
#paul:hover{transform:scale(1.03)}
#paul:active{transform:scale(.94); box-shadow:0 2px 0 var(--line)}
#paul:focus-visible{outline:4px dashed var(--tomato); outline-offset:6px}
#paul svg,#paul img{width:100%; height:100%; display:block; object-fit:cover}
.pop{position:absolute; font-family:var(--display); font-size:1.4rem; color:var(--tomato); -webkit-text-stroke:1px var(--line); pointer-events:none; animation:pop 900ms ease-out forwards; z-index:5; white-space:nowrap}
@keyframes pop{from{opacity:1; transform:translate(-50%,0) scale(1)} to{opacity:0; transform:translate(-50%,-90px) scale(1.3)}}

.tools{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:8px}
.btn{font:600 .85rem var(--body); background:var(--card); border:2px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer; color:var(--ink)}
.btn:hover{background:#fff}
.btn:focus-visible{outline:3px solid var(--tomato); outline-offset:2px}
.btn.danger{color:var(--tomato)}
.confirm{margin-top:8px; font-weight:600; font-size:.9rem}

.ticker{margin-top:12px; background:var(--ink); color:var(--sun); border-radius:10px; padding:8px 12px; font-weight:600; font-size:.9rem; min-height:2.6em; display:flex; align-items:center; justify-content:center; text-align:center}

.golden{position:absolute; width:64px; height:64px; border-radius:50%; border:3px solid var(--line); background:radial-gradient(circle at 35% 35%, #fff6b0, #ffc400 60%, #c98a00); cursor:pointer; z-index:6; font-family:var(--display); font-size:1.6rem; color:var(--line); animation:bob 1.2s ease-in-out infinite; box-shadow:0 0 0 6px rgba(255,255,255,.6)}
@keyframes bob{50%{transform:translateY(-8px) rotate(8deg)}}
.boost{position:absolute; top:12px; right:12px; background:var(--tomato); color:#fff; border:2px solid var(--line); border-radius:999px; padding:4px 10px; font-weight:800; font-size:.8rem; font-variant-numeric:tabular-nums}

.shop{background:var(--card); border:3px solid var(--line); border-radius:22px; box-shadow:6px 6px 0 var(--line); padding:16px; min-width:0}
.shop h2{font-family:var(--display); font-weight:400; font-size:1.5rem; margin:0 0 4px}
.shop h3{font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); margin:16px 0 8px}
.list{display:grid; gap:8px}
.item{
  display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; text-align:left;
  background:#fff; border:2px solid var(--line); border-radius:14px; padding:8px 10px; cursor:pointer; font:inherit; color:inherit; width:100%;
  transition:transform .08s, background .15s;
}
.item:hover:not(:disabled){background:#fff3c4; transform:translateX(2px)}
.item:focus-visible{outline:3px solid var(--tomato); outline-offset:2px}
.item:disabled{opacity:.45; cursor:not-allowed}
.item .ico{width:44px; height:44px; border-radius:10px; background:var(--sky2); border:2px solid var(--line); display:grid; place-items:center; font-family:var(--display); font-size:1.2rem}
.item .name{font-weight:800; line-height:1.15}
.item .desc{font-size:.8rem; color:var(--mute); line-height:1.3}
.item .cost{font-weight:800; font-variant-numeric:tabular-nums; font-size:.9rem}
.item .owned{font-family:var(--display); font-size:1.4rem; text-align:right; font-variant-numeric:tabular-nums; min-width:2ch}
.item.bought{display:none}
.empty{font-size:.85rem; color:var(--mute)}
.stats{display:grid; grid-template-columns:1fr auto; gap:4px 12px; font-size:.85rem; font-variant-numeric:tabular-nums}
.stats dt{color:var(--mute)} .stats dd{margin:0; font-weight:700; text-align:right}
@media (prefers-reduced-motion:reduce){ .rays,.golden{animation:none} .pop{animation-duration:1ms} }
</style>

<div class="wrap">
  <section class="stage" id="stage">
    <h1>Paul Clicker</h1>
    <div class="count"><span id="count">0</span><small>Pauls</small></div>
    <div class="pps"><span id="pps">0</span> Pauls per second</div>
    <div class="paulzone" id="zone">
      <div class="rays"></div>
      <button id="paul" aria-label="Click Paul"></button>
    </div>
    <div class="tools">
      <label class="btn" for="photo">Use a different photo</label>
      <input type="file" id="photo" accept="image/*" hidden>
      <button class="btn" id="resetPhoto" hidden>Back to the original Paul</button>
      <button class="btn danger" id="reset">Reset game</button>
    </div>
    <div class="confirm" id="confirmBox" hidden>Wipe all your Pauls?
      <button class="btn danger" id="yes">Yes, wipe</button> <button class="btn" id="no">Keep them</button></div>
    <div class="ticker" id="ticker">Local man named Paul unaware he is about to become a currency.</div>
  </section>

  <section class="shop">
    <h2>Paul Shop</h2>
    <h3>Upgrades</h3>
    <div class="list" id="upgrades"></div>
    <p class="empty" id="noUp" hidden>You've bought every upgrade. Paul is at peak Paul.</p>
    <h3>Buildings</h3>
    <div class="list" id="buildings"></div>
    <h3>Stats</h3>
    <dl class="stats">
      <dt>Pauls per click</dt><dd id="sClick">1</dd>
      <dt>Total Pauls ever</dt><dd id="sTotal">0</dd>
      <dt>Times you clicked Paul</dt><dd id="sClicks">0</dd>
      <dt>Golden Pauls caught</dt><dd id="sGold">0</dd>
    </dl>
  </section>
</div>

  {id:'click%', name:'Paul Believes In You', desc:'Each click also adds 2% of your Pauls per second.', cost:20000, kind:'clickpct', pct:0.02, req:{fanclub:3}},
  {id:'fan2', name:'Matching T-Shirts', desc:'Fan Clubs are 2× as effective.', cost:55000, kind:'b', target:'fanclub', mult:2, req:{fanclub:10}},
  {id:'gold', name:'Golden Retriever Named Paul', desc:'Golden Pauls show up twice as often.', cost:77777, kind:'gold'},
  {id:'all', name:'Paul Gets a Promotion', desc:'All buildings produce 1.5× Pauls.', cost:500000, kind:'all', mult:1.5, req:{factory:1}},
  {id:'clone2', name:'Better Goo', desc:'Cloning Vats are 2× as effective.', cost:600000, kind:'b', target:'clone', mult:2, req:{clone:10}},
  {id:'all2', name:'Paul for President', desc:'All buildings produce 2× Pauls.', cost:5e7, kind:'all', mult:2, req:{embassy:1}},
];
const NEWS = [
  "Scientists confirm: there are now more Pauls than pigeons.",
  "Paul seen buying groceries. Shoppers report feeling clicked.",
  "John claims he's 'basically Paul'. Experts disagree.",
  "John spotted clicking Paul at 3am. Asked why, John said 'someone has to'.",
  "Stock market switches to Paul standard. Dollar 'not mad, just disappointed'.",
  "Paul asked to comment on his own mass production. Paul: 'huh?'",
  "Fan club splits over correct pronunciation of 'Paul'.",
  "Weather forecast: cloudy with a 90% chance of Paul.",
  "Mirror manufacturers report record sales, refuse to explain why.",
  "Study finds clicking Paul is 40% more satisfying than bubble wrap.",
  "Paul's mom 'proud but concerned'.",
  "Runner Paul spotted doing laps around the factory. Productivity soars.",
  "BREAKING: Paul legally changes name to Pool. Nobody notices the difference.",
  "Local man called 'Pool' asked if he is a pool. Pool declines to comment.",
  "Pool seen at the pool. Lifeguard confused about which one to watch.",
  "Swimmer Paul breaks lap record, then immediately asks for snacks.",
  "Boulder named Employee of the Month for the 12th month in a row.",
  "Boulder caught eating a Paul. Paul says it's fine, he has millions.",
  "Poll finds Boulder more popular than Paul. Paul: 'that's fair'.",
  "Boulder barks at the mailman. Paul production briefly halts.",
  "Food Stealer Paul strikes again. Victim's sandwich 'just gone'.",
  "Paul stole food and a short king is stealing it back.",
  "Paul asks 'are you gonna finish that?' 4,000 times in one day.",
  "Cafeteria installs Paul alarm. It goes off immediately.",
  "Boulder and Paul team up to steal a pizza. Both deny everything.",
  "John's snacks reported missing. Prime suspect: Paul. Paul has crumbs on his face.",
  "Goggle marks on Paul's face now permanent. Experts call it 'a look'.",
  "Cloned Paul #4,812 requests a day off. Request denied by Paul #1.",
  "Astronomers discover planet made entirely of Paul. 'It waved at us.'",
];

let S = fresh();
function fresh(){ return {pauls:0,total:0,clicks:0,gold:0,owned:{},ups:[],photo:null}; }
function load(){ try{ const d=JSON.parse(localStorage.getItem('paulClicker')||'null'); if(d) S=Object.assign(fresh(),d);}catch(e){} }
function save(){ try{ localStorage.setItem('paulClicker', JSON.stringify(S)); }catch(e){ if(S.photo){ try{ const c={...S,photo:null}; localStorage.setItem('paulClicker',JSON.stringify(c)); }catch(_){} } } }

let boost = {mult:1, until:0, label:''};
const $ = id => document.getElementById(id);

function fmt(n){
  if(n<1000) return n<10 && n%1 ? n.toFixed(1) : Math.floor(n).toLocaleString();
  const u=['','thousand','million','billion','trillion','quadrillion','quintillion'];
  if(n<1e6) return Math.floor(n).toLocaleString();
  let i=Math.floor(Math.log10(n)/3); i=Math.min(i,u.length-1);
  return (n/Math.pow(1000,i)).toFixed(2)+' '+u[i];
}
const owned = id => S.owned[id]||0;
const has = id => S.ups.includes(id);
const cost = b => Math.ceil(b.base*Math.pow(1.15, owned(b.id)));
function bMult(id){ let m=1; for(const u of UPGRADES) if(has(u.id)&&((u.kind==='b'&&u.target===id)||u.kind==='all')) m*=u.mult; if(has('runner')) m*=1.25; return m; }
function basePps(){ return BUILDINGS.reduce((s,b)=>s+owned(b.id)*b.pps*bMult(b.id),0); }
function pps(){ return basePps()*(boost.until>Date.now()&&boost.kind==='pps'?boost.mult:1); }
function perClick(){
  let c=1; for(const u of UPGRADES) if(has(u.id)&&(u.kind==='click'||u.kind==='runner')) c*=u.mult;
  for(const u of UPGRADES) if(has(u.id)&&u.kind==='clickpct') c+=basePps()*u.pct;
  if(boost.until>Date.now()&&boost.kind==='click') c*=boost.mult;
  return c;
}
function earn(n){ S.pauls+=n; S.total+=n; }
function unlocked(u){ if(!u.req) return true; return Object.entries(u.req).every(([k,v])=> k==='_clicks'? S.clicks>=v : owned(k)>=v); }

function renderPaul(){
  $('paul').innerHTML = `<img src="${[S.photo||PAUL_PHOTO, ...EXTRA_PAULS][faceIdx]}" alt="Paul" draggable="false">`;
  $('resetPhoto').hidden = !S.photo;
}

function buildShop(){
  $('buildings').innerHTML = BUILDINGS.map(b=>`<button class="item" id="b-${b.id}"><span class="ico">${b.ico}</span><span><span class="name">${b.name}</span><br><span class="desc">${b.desc} +${fmt(b.pps)}/s each</span><br><span class="cost" id="bc-${b.id}"></span></span><span class="owned" id="bo-${b.id}">0</span></button>`).join('');
  BUILDINGS.forEach(b=> $('b-'+b.id).onclick=()=>{ const c=cost(b); if(S.pauls>=c){ S.pauls-=c; S.owned[b.id]=owned(b.id)+1; save(); update(); } });
  $('upgrades').innerHTML = UPGRADES.map(u=>`<button class="item" id="u-${u.id}"><span class="ico">↑</span><span><span class="name">${u.name}</span><br><span class="desc">${u.desc}</span></span><span class="cost">${fmt(u.cost)}</span></button>`).join('');
  UPGRADES.forEach(u=> $('u-'+u.id).onclick=()=>{ if(S.pauls>=u.cost && !has(u.id)){ S.pauls-=u.cost; S.ups.push(u.id); save(); update(); } });
}

function update(){
  $('count').textContent = fmt(S.pauls);
  $('pps').textContent = fmt(pps());
  BUILDINGS.forEach((b,i)=>{
    const el=$('b-'+b.id), c=cost(b);
    const visible = i===0 || owned(BUILDINGS[i-1].id)>0 || S.total>=b.base*0.5;
    el.hidden=!visible;
    el.disabled = S.pauls<c;
    $('bc-'+b.id).textContent = fmt(c)+' Pauls';
    $('bo-'+b.id).textContent = owned(b.id);
  });
  let shown=0;
  UPGRADES.forEach(u=>{
    const el=$('u-'+u.id);
    const show = !has(u.id) && unlocked(u) && S.total>=u.cost*0.3;
    el.hidden=!show; el.disabled=S.pauls<u.cost; if(show) shown++;
  });
  $('noUp').hidden = !(S.ups.length===UPGRADES.length);
  $('sClick').textContent=fmt(perClick());
  $('sTotal').textContent=fmt(S.total);
  $('sClicks').textContent=S.clicks.toLocaleString();
  $('sGold').textContent=S.gold;
  document.title = fmt(S.pauls)+' Pauls · Paul Clicker';
  const bt=$('boostTag');
  if(boost.until>Date.now()){ const s=Math.ceil((boost.until-Date.now())/1000); if(bt) bt.textContent=`${boost.label} ${s}s`; }
  else if(bt) bt.remove();
}

function popText(x,y,txt){
  const p=document.createElement('div'); p.className='pop'; p.textContent=txt;
  const r=$('zone').getBoundingClientRect(); p.style.left=(x-r.left)+'px'; p.style.top=(y-r.top-20)+'px';
  $('zone').appendChild(p); setTimeout(()=>p.remove(),900);
}

$('paul').addEventListener('click', e=>{
  const n=perClick(); earn(n); S.clicks++;
  const r=$('paul').getBoundingClientRect();
  const x=e.clientX||r.left+r.width/2, y=e.clientY||r.top+r.height/2;
  popText(x,y,'+'+fmt(n));
  if(S.clicks % SWAP_EVERY === 0){ faceIdx = (faceIdx+1) % (1+EXTRA_PAULS.length); renderPaul(); }
  update();
});

$('photo').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{ // shrink so it fits in storage
      const c=document.createElement('canvas'), s=360, m=Math.min(img.width,img.height);
      c.width=c.height=s; c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
      S.photo=c.toDataURL('image/jpeg',0.82); renderPaul(); save();
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f); e.target.value='';
});
$('resetPhoto').onclick=()=>{ S.photo=null; renderPaul(); save(); };
$('reset').onclick=()=>{ $('confirmBox').hidden=false; };
$('no').onclick=()=>{ $('confirmBox').hidden=true; };
$('yes').onclick=()=>{ const p=S.photo; S=fresh(); S.photo=p; boost.until=0; save(); $('confirmBox').hidden=true; update(); };

// Golden Paul
function spawnGolden(){
  const g=document.createElement('button'); g.className='golden'; g.textContent='P'; g.setAttribute('aria-label','Golden Paul');
  const st=$('stage'); g.style.left=(10+Math.random()*(st.clientWidth-84))+'px'; g.style.top=(60+Math.random()*(st.clientHeight-140))+'px';
  st.appendChild(g);
  const kill=setTimeout(()=>g.remove(),9000);
  g.onclick=e=>{
    clearTimeout(kill); g.remove(); S.gold++;
    const roll=Math.random();
    if(roll<0.45){ const n=Math.max(13, Math.min(S.pauls*0.15, basePps()*900)+13); earn(n); popText(e.clientX,e.clientY,'Lucky! +'+fmt(n)); news('A Golden Paul! Pauls rain from the sky.'); }
    else if(roll<0.85){ setBoost('pps',7,30,'Paul Frenzy ×7'); news('Paul Frenzy! Production ×7 for 30 seconds.'); }
    else { setBoost('click',77,10,'Click Frenzy ×77'); news('Click Frenzy! Every click is worth 77× for 10 seconds.'); }
    save(); update();
  };
}
function setBoost(kind,mult,secs,label){
  boost={kind,mult,until:Date.now()+secs*1000,label};
  let bt=$('boostTag'); if(!bt){ bt=document.createElement('div'); bt.className='boost'; bt.id='boostTag'; $('stage').appendChild(bt); }
}
function scheduleGolden(){ const base=has('gold')?30000:60000; setTimeout(()=>{ spawnGolden(); scheduleGolden(); }, base+Math.random()*base); }

function news(t){ $('ticker').textContent=t; }
function randomNews(){
  const pool=[...NEWS];
  if(owned('planet')) pool.push("Planet Paul joins the UN. Every seat is Paul.");
  if(S.photo) pool.push("Paul's face now recognized in 190 countries.");
  if(S.total>1e6) pool.push(`Census reports ${fmt(S.total)} Pauls produced to date.`);
  news(pool[Math.floor(Math.random()*pool.length)]);
}

// game loop
let last=Date.now();
setInterval(()=>{ const now=Date.now(); earn(pps()*(now-last)/1000); last=now; update(); },100);
setInterval(save,5000);
setInterval(randomNews,9000);

function start(){
  load();
  // offline earnings (capped at 1 hour)
  buildShop(); renderPaul(); update(); scheduleGolden();
}
start();
window.addEventListener('beforeunload',save);
</script>

</body></html>
